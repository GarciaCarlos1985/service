name: Android

on:
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar e analisar Android
        working-directory: mobile/android
        run: bash gradlew --no-daemon --console=plain :app:assembleDebug :app:bundleRelease :app:lintRelease
      - name: Guardar artefatos de laboratório
        uses: actions/upload-artifact@v4
        with:
          name: android-laboratorio
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/reports/lint-results-release.html
          retention-days: 7
