<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102d52" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Conecte-se para continuar | Service Guide</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: #102d52;
        background: #f4f7fb;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 560px;
        margin: 12vh auto;
        padding: 32px max(24px, env(safe-area-inset-left));
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 16px;
      }
      h1 {
        font-size: clamp(30px, 7vw, 44px);
        line-height: 1.15;
        letter-spacing: -0.025em;
        margin: 32px 0 20px;
      }
      p {
        font-size: 17px;
        line-height: 1.65;
        margin: 0 0 28px;
      }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 14px 24px;
        border-radius: 8px;
        background: #102d52;
        color: white;
        text-decoration: none;
        font-weight: 650;
      }
      a:focus-visible {
        outline: 3px solid #005cc5;
        outline-offset: 5px;
      }
      small {
        display: block;
        margin-top: 32px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/app-icons/icon-192.png" width="96" height="96" alt="Service Guide" />
      <h1>Conecte-se para continuar.</h1>
      <p>
        Não conseguimos acessar o guia agora. Confira sua conexão e tente novamente para pesquisar
        empresas e consultar informações atualizadas.
      </p>
      <a href="/">Tentar novamente</a>
      <small>Dados da conta e alterações no painel exigem conexão.</small>
    </main>
  </body>
</html>
